[package]
name = "sealed-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sampled on-chain audits of private AI evals using NEAR AI Cloud TEE response signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
